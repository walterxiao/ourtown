<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Town</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="login" class="overlay">
    <form id="loginForm" class="panel">
      <h1>Our Town</h1>
      <p class="sub">Enter the town.</p>
      <label>Name<input id="name" autocomplete="off" maxlength="24" required></label>
      <label>Passcode<input id="pass" type="password" autocomplete="off" required></label>
      <button type="submit">Enter</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>

  <div id="hud" hidden>
    <div id="topBar">
      <div id="youTag"></div>
      <div id="playerList"></div>
    </div>

    <div id="promptBar"></div>

    <div id="buildBar" hidden>
      <div class="tools">
        <button class="tool" data-tool="wall">Wall</button>
        <button class="tool" data-tool="door">Door</button>
        <button class="tool" data-tool="window">Window</button>
        <button class="tool" data-tool="remove">Remove</button>
      </div>
      <button id="exitBuild">Done</button>
      <div class="hint">Click an edge to place. Keys: 1 wall · 2 door · 3 window · X remove · Esc exit</div>
    </div>

    <div id="toast"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js"
    }
  }
  </script>
  <script>
    // Fallback: if the module graph fails to load (blocked CDN, syntax error in a module),
    // the form would otherwise submit normally and look like "Enter does nothing".
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      if (!window.__OURTOWN_READY__) {
        e.preventDefault();
        document.getElementById('loginError').textContent =
          'Game failed to load — check the browser console (⌥⌘I / Ctrl+Shift+I).';
      }
    });
    window.addEventListener('error', (ev) => {
      const el = document.getElementById('loginError');
      if (el && !window.__OURTOWN_READY__) el.textContent = 'Load error: ' + (ev.message || 'see console');
    });
  </script>
  <script type="module" src="/client.js"></script>
</body>
</html>
